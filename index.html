/* Estilo Enerview (sistema de diseño ATEC): escenario fijo 1920×1080 escalado a la pantalla; contenido arriba, pie con sección, avance, reloj y logotipo */
:root {
  --surface: #020a1c;
  --surface-alt: #0a1b3a;
  --panel: #0c1f40;
  --border: #3a5578;
  --line: #3a5078;
  --ink: #ffffff;
  --ink-muted: #b9c6d8;
  --ink-subtle: #8fa3bf;
  --green: #39ff14;
  --green-tec: #35df0a;
  --cian: #14e1ff;
  --on-accent: #020a1c;
  --glow-text: 0 0 14px rgba(57, 255, 20, 0.6);
  --glow-fluor: 0 0 18px rgba(57, 255, 20, 0.65);
  --r-md: 8px;
  --r-lg: 16px;
  --sans: "Ubuntu", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  background: var(--surface); color: var(--ink); font-family: var(--sans); font-weight: 300;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0; overflow: hidden;
}
body.fs { padding: 0; }
body.idle, body.idle * { cursor: none; }

.viewport { width: 100%; height: 100%; position: relative; overflow: hidden; }
.stage {
  width: 1920px; height: 1080px; position: absolute; left: 50%; top: 50%; overflow: hidden;
  transform-origin: center center; transform: translate(-50%, -50%) scale(0.5);
  background: var(--surface);
}
/* Línea de luz verde y azul sobre el pie (fondo de presentación) */
.lightline {
  position: absolute; left: 0; right: 0; bottom: 128px; height: 2px; pointer-events: none;
  background: linear-gradient(90deg, transparent 0%, rgba(57,255,20,0.75) 30%, rgba(13,128,242,0.75) 75%, transparent 100%);
  box-shadow: 0 0 22px rgba(57,255,20,0.35), 0 0 60px rgba(13,128,242,0.25);
}
.lightline::after {
  content: ""; position: absolute; left: 10%; right: 10%; top: -120px; height: 120px;
  background: radial-gradient(60% 100% at 50% 100%, rgba(13,128,242,0.10), transparent 70%);
}

/* Láminas */
.slide {
  position: absolute; inset: 0 0 130px 0; padding: 88px 128px 0;
  display: flex; flex-direction: column;
  opacity: 0; visibility: hidden; transition: opacity 900ms ease, visibility 0s linear 900ms;
}
.slide.on { opacity: 1; visibility: visible; transition: opacity 900ms ease, visibility 0s; }
.slide .rise { transform: translateY(24px); opacity: 0; transition: transform 900ms cubic-bezier(.2,.7,.2,1), opacity 900ms ease; }
.slide.on .rise { transform: none; opacity: 1; }
.slide.on .d1 { transition-delay: 120ms; } .slide.on .d2 { transition-delay: 260ms; }
.slide.on .d3 { transition-delay: 400ms; } .slide.on .d4 { transition-delay: 540ms; }

.eyebrow { font-size: 26px; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: var(--green); }
h1, h2, h3 { margin: 0; text-wrap: balance; font-family: var(--sans); }
.h-l { font-size: 88px; line-height: 1.08; font-weight: 700; letter-spacing: -0.01em; margin-top: 24px; }
.h-m { font-size: 60px; line-height: 1.12; font-weight: 700; }
.hl { color: var(--green); text-shadow: var(--glow-text); }
.muted { color: var(--ink-muted); }
.tnum { font-variant-numeric: tabular-nums; }

/* Portada */
.cover { justify-content: center; }
.cover-row { display: flex; align-items: center; gap: 64px; }
.cover .logo { width: 620px; flex: none; filter: drop-shadow(0 0 22px rgba(57,255,20,0.28)); }
.cover .div { width: 1px; align-self: stretch; background: var(--ink); opacity: 0.9; }
.cover .tag { font-size: 76px; line-height: 1.1; font-weight: 700; max-width: 13ch; }
.cover .hello { margin-top: 72px; font-size: 40px; color: var(--ink-muted); }

/* Misión / visión */
.statement .text { margin-top: 48px; font-size: 66px; line-height: 1.24; font-weight: 300; max-width: 27ch; text-wrap: pretty; }
.statement .text b { font-weight: 700; }

/* Cita */
.quote { justify-content: center; gap: 56px; }
.quote blockquote { margin: 0; font-size: 80px; line-height: 1.2; font-weight: 400; max-width: 23ch; text-wrap: balance; position: relative; }
.quote blockquote .qm.open { position: absolute; right: 100%; margin-right: 0.06em; }
.quote blockquote .g { color: var(--green); font-weight: 500; }
.quote blockquote .qm { color: var(--green); font-weight: 700; }
.who { display: flex; align-items: center; gap: 24px; font-size: 34px; }
.who .bar { width: 1px; height: 76px; background: var(--ink); }
.who .name { font-weight: 500; }

/* Valores */
.values { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 32px; margin-top: 56px; }
.value {
  background: var(--surface-alt); border: 1px solid var(--border); border-radius: var(--r-lg);
  padding: 40px 32px 44px; display: flex; flex-direction: column; gap: 20px; min-height: 540px;
  transition: border-color 700ms ease, box-shadow 700ms ease, transform 700ms ease;
}
.value .bar { height: 4px; width: 56px; border-radius: 2px; background: var(--border); transition: width 900ms ease, background 700ms ease, box-shadow 700ms ease; }
.value h3 { font-size: 36px; font-weight: 700; letter-spacing: 0.01em; text-transform: uppercase; white-space: nowrap; }
.value p { margin: 0; font-size: 30px; line-height: 1.45; color: var(--ink-muted); transition: color 700ms ease; }
.value.lit { border-color: var(--green); box-shadow: var(--glow-fluor); transform: translateY(-10px); }
.value.lit .bar { width: 100%; background: var(--green); box-shadow: var(--glow-fluor); }
.value.lit p { color: var(--ink); }

/* Lo que hacemos (etapas) */
.stages { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 40px 48px; margin-top: 56px; }
.stage-col { border-top: 4px solid var(--green); padding-top: 26px; display: flex; flex-direction: column; gap: 12px; box-shadow: 0 -6px 18px -12px rgba(57,255,20,0.7); }
.stage-col h3 { font-size: 40px; font-weight: 700; line-height: 1.15; }
.stage-col p { margin: 0; font-size: 28px; line-height: 1.4; color: var(--ink-muted); }
.stage-col .who-g { font-size: 20px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-subtle); font-weight: 500; }

/* Nuestra gente */
.people { display: grid; grid-template-columns: 560px minmax(0, 1fr); gap: 96px; margin-top: 52px; align-items: start; }
.big-n { font-size: 250px; line-height: 0.9; font-weight: 700; letter-spacing: -0.04em; color: var(--green); text-shadow: 0 0 28px rgba(57,255,20,0.45); }
.big-cap { font-size: 38px; line-height: 1.35; color: var(--ink-muted); margin-top: 28px; max-width: 18ch; }
.big-cap b { color: var(--ink); font-weight: 500; }
.split { display: flex; gap: 48px; margin-top: 44px; }
.split div { display: flex; flex-direction: column; gap: 4px; }
.split b { font-size: 64px; font-weight: 700; line-height: 1; }
.split span { font-size: 24px; color: var(--ink-subtle); letter-spacing: 0.1em; text-transform: uppercase; font-weight: 500; }
.split .z b { color: var(--cian); }
.bars { display: flex; flex-direction: column; gap: 16px; }
.bar-row { display: grid; grid-template-columns: 400px minmax(0, 1fr) 80px; gap: 24px; align-items: center; font-size: 28px; }
.bar-row .lbl { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 400; }
.bar-row .track { height: 30px; position: relative; border-left: 1px solid var(--line); }
.bar-row .fill { position: absolute; left: 0; top: 0; bottom: 0; width: 0; border-radius: 0 6px 6px 0; background: var(--green); transition: width 1400ms cubic-bezier(.2,.7,.2,1); }
.bar-row.z .fill { background: var(--cian); }
.bar-row.z { margin-top: 18px; padding-top: 22px; border-top: 1px dashed var(--border); }
.bar-row .val { font-weight: 700; font-size: 32px; text-align: right; }
.bar-row.z .lbl { color: var(--cian); }

/* Gerencia destacada */
.spot { display: grid; grid-template-columns: minmax(0, 1fr) 640px; gap: 80px; margin-top: 8px; align-items: start; }
.spot .h-l { font-size: 70px; }
.lead-by { display: flex; align-items: center; gap: 28px; margin-top: 30px; }
.avatar { width: 112px; height: 112px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: 40px; color: var(--ink); background: var(--surface-alt); border: 3px solid var(--green); box-shadow: var(--glow-fluor); flex: none; }
.lead-by .name { font-size: 42px; font-weight: 500; }
.lead-by .role { font-size: 30px; color: var(--ink-muted); margin-top: 4px; }
.areas { margin-top: 34px; display: flex; flex-wrap: wrap; gap: 12px; max-width: 1000px; }
.chip { border: 1px solid var(--border); border-radius: 999px; padding: 9px 22px; font-size: 24px; font-weight: 400; }
.team-card { border-radius: var(--r-lg); background: var(--surface-alt); border: 1px solid var(--border); padding: 40px 46px; margin-top: 24px; }
.team-card .count { display: flex; align-items: baseline; gap: 16px; }
.team-card .count b { font-size: 100px; line-height: 1; font-weight: 700; color: var(--green); text-shadow: var(--glow-text); }
.team-card .count span { font-size: 32px; color: var(--ink-muted); }
.team-card h4 { font-size: 22px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--ink-subtle); margin: 26px 0 8px; font-weight: 500; }
.leaders { list-style: none; margin: 0; padding: 0; }
.leaders li { padding: 12px 0; border-top: 1px solid var(--line); }
.leaders .n { font-size: 29px; font-weight: 500; }
.leaders .r { font-size: 23px; color: var(--ink-muted); margin-top: 2px; }

/* Cumpleaños */
.bday-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 18px 40px; margin-top: 44px; }
.bday-grid.few { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px 64px; }
.bd { display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 24px; align-items: center; padding: 14px 0; border-top: 1px solid var(--line); }
.bd .day { width: 96px; height: 96px; border-radius: 50%; display: grid; place-items: center; border: 2px solid var(--border); font-size: 40px; font-weight: 700; }
.bd .n { font-size: 32px; font-weight: 500; line-height: 1.2; }
.bd .n em { font-style: normal; color: var(--green-tec); }

function preguntaDelDia() {
  const t = hoy(), iso = `${t.y}-${String(t.m).padStart(2, "0")}-${String(t.d).padStart(2, "0")}`;
  const ps = ENCUESTA.preguntas.filter(p => p.fecha <= iso).sort((x, y) => x.fecha < y.fecha ? -1 : 1);
  return { actual: ps[ps.length - 1] || null, anterior: ps[ps.length - 2] || null, esHoy: !!ps.length && ps[ps.length - 1].fecha === iso };
}

const TZ = "America/Santiago";
const MESES = ["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
const MESES_C = MESES.map(m => m[0].toUpperCase() + m.slice(1));
function hoy() {
  const p = new Intl.DateTimeFormat("en-CA", { timeZone: TZ, year: "numeric", month: "2-digit", day: "2-digit", weekday: "short" }).formatToParts(new Date());
  const g = t => p.find(x => x.type === t).value;
  return { y: +g("year"), m: +g("month"), d: +g("day"), wd: g("weekday") };
}
function diasHasta(iso) {
  const t = hoy(); const [y, m, d] = iso.split("-").map(Number);
  return Math.round((Date.UTC(y, m - 1, d) - Date.UTC(t.y, t.m - 1, t.d)) / 86400000);
}
const val = v => typeof v === "function" ? v() : v;
function iniciales(n) { return n.split(/\s+/).filter(Boolean).slice(0, 2).map(w => w[0]).join("").toUpperCase(); }
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c])); }
function store(k, v) { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) { return null; } }

function cumpleMes() { const m = hoy().m; return CUMPLES.filter(c => c[1] === m).sort((a, b) => a[0] - b[0]); }
function cumpleHoy() { const t = hoy(); return CUMPLES.filter(c => c[1] === t.m && c[0] === t.d); }
function proximas() {
  return CONFIG.fechas.map(f => ({ ...f, dias: diasHasta(f.fecha) })).filter(f => f.dias >= 0 && f.dias <= 60).sort((a, b) => a.dias - b.dias).slice(0, 3);
}
/* Confeti repartido por toda la lámina, esquivando fotos y textos */
function llenarConfeti(slide) {
  const box = slide.querySelector(".confetti"); if (!box) return;
  const n = +box.dataset.n || 100, sc = stage.getBoundingClientRect().width / 1920 || 1;
  const sr = slide.getBoundingClientRect(), W = sr.width / sc, H = sr.height / sc;
  const zonas = [...slide.querySelectorAll(".eyebrow, .h-l, .ph, .bc .dt, .bc .n, .bc .r, .bc.today, .bd, .today-faces img, .today-faces div, .greet, .names, .pill")]
    .map(e => e.getBoundingClientRect()).filter(r => r.width > 0)
    .map(r => [(r.left - sr.left) / sc - 14, (r.top - sr.top) / sc - 14 - 24, (r.right - sr.left) / sc + 14, (r.bottom - sr.top) / sc + 14]);
  const cols = ["#39ff14", "#14e1ff", "#ffe714", "#ffffff"]; let s = "", seed = 20251;
  const rnd = () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };
  const puestas = [];
  for (let t = 0; puestas.length < n && t < n * 80; t++) {
    const x = rnd() * W, y = rnd() * H;
    if (zonas.some(([l, tp, r, b]) => x > l && x < r && y > tp && y < b)) continue;
    if (puestas.some(([px, py]) => Math.hypot(px - x, py - y) < 52)) continue;
    puestas.push([x, y]);
    const k = puestas.length, rot = Math.round(rnd() * 180), redondo = rnd() < 0.18;
    const w = redondo ? 10 + Math.round(rnd() * 6) : 10 + Math.round(rnd() * 12), h = redondo ? w : 5 + Math.round(rnd() * 3);
    s += `<i style="left:${x.toFixed(0)}px;top:${y.toFixed(0)}px;width:${w}px;height:${h}px;background:${cols[k % 4]};transform:rotate(${rot}deg)${redondo ? ";border-radius:50%" : ""}"></i>`;
  }
  box.innerHTML = s;
}
function pollSlide() {
  return { grupo: "Pregunta del día", dur: 16, poll: true, cuando: () => !!preguntaDelDia().actual, html: () => {

    const pa = tot ? Math.round(va / tot * 100) : 0, pb = tot ? 100 - pa : 0;

    return `<section class="slide">
      <div class="eyebrow rise">Pregunta del día · Vota con tu celular</div>
      <div class="poll">
        <div style="min-width:0">
          <div class="q rise d1">${esc(p.q)}</div>
          <div class="poll-opts rise d2">${op(p.a, "a", pa, va, tot && va > vb)}${op(p.b, "b", pb, vb, tot && vb > va)}</div>
          <div class="poll-total rise d3">${total}</div>
        </div>
        <div class="rise d2">${qr}${gan}</div>
      </div>
    </section>`; } };
}

/* Acuerdos para la oficina: aparece 2 veces por vuelta */
(() => { const a = LAMINAS.find(l => l.grupo === "Acuerdos para la oficina"); const k = LAMINAS.findIndex(l => l.grupo === "Conoce a los equipos"); LAMINAS.splice(k + 1, 0, a); })();
/* Pregunta del día: última lámina de la vuelta */
LAMINAS.push(pollSlide());

/* ============================================================
   MOTOR DE ROTACIÓN
   ============================================================ */
const slidesEl = document.getElementById("slides"), progEl = document.getElementById("progress");
const labelEl = document.getElementById("footLabel"), stage = document.getElementById("stage");
let lista = [], i = 0, timer = null, raf = null, t0 = 0, paused = false, timers = [];

function construir() {
  lista = LAMINAS.filter(l => !l.cuando || l.cuando());
  progEl.innerHTML = lista.map(() => `<div class="seg"><i></i></div>`).join("");
}
function later(fn, ms) { timers.push(setTimeout(fn, ms)); }
function every(fn, ms) { timers.push(setInterval(fn, ms)); }

function mostrar(k) {
  clearTimeout(timer); cancelAnimationFrame(raf); timers.forEach(t => { clearTimeout(t); clearInterval(t); }); timers = [];
  const olds = [...slidesEl.querySelectorAll(".slide")];
  olds.forEach((o, j) => {
    o.classList.remove("on");
    if (j < olds.length - 1 || document.hidden) o.remove();
    else setTimeout(() => o.remove(), 950);
  });
  i = (k + lista.length) % lista.length;
  const L = lista[i];
  const wrap = document.createElement("div"); wrap.innerHTML = L.html().trim();
  const el = wrap.firstElementChild; slidesEl.appendChild(el);
  void el.offsetWidth; el.classList.add("on");
  labelEl.textContent = "abastibletec · " + L.grupo.toUpperCase();
  [...progEl.children].forEach((s, j) => { s.classList.toggle("done", j < i); s.firstElementChild.style.width = j < i ? "100%" : "0"; });

  const dur = (L.dur || CONFIG.segundosPorLamina) * 1000;
  if (el.querySelector(".confetti")) llenarConfeti(el);
  if (L.poll) {
    later(() => el.querySelectorAll(".popt .bar i").forEach(b => b.style.width = b.dataset.w + "%"), 350);
  }
  if (L.barras) later(() => el.querySelectorAll(".fill").forEach(f => f.style.width = f.dataset.w + "%"), 350);
  if (L.valores || L.oiem) {
    const vs = el.querySelectorAll(L.valores ? ".value" : ".el"); let v = 0;
    const lit = () => { vs.forEach((x, j) => x.classList.toggle("lit", j === v)); v = (v + 1) % vs.length; };
    later(lit, 700); every(lit, L.valores ? (dur - 700) / 4 : 1500);
  }
  if (L.trivia) {
    const bar = el.querySelector(".timer i"), revealAt = dur * 0.55;
    bar.style.transition = `transform ${revealAt}ms linear`;
    later(() => bar.style.transform = "scaleX(0)", 60);
    later(() => el.classList.add("revealed"), revealAt);
  }

  t0 = performance.now();
  const seg = progEl.children[i].firstElementChild;
  const rocket = document.getElementById("rocket");
  const tick = now => {
    if (!paused) {
      const f = Math.min(1, (now - t0) / dur);
      seg.style.width = f * 100 + "%";
      rocket.style.left = `calc(${(i + f) / lista.length} * (100% - 40px))`;
    }
    raf = requestAnimationFrame(tick);
  };
  raf = requestAnimationFrame(tick);
  if (!paused) timer = setTimeout(siguiente, dur);
}
function siguiente() {
  const L = lista[i];
  if (L.spot) { spotIdx = (spotIdx + 1) % GERENCIAS.length; store("atec-spot", spotIdx); }
  if (L.ben) { benIdx = (benIdx + 1) % BENEFICIOS.length; store("atec-ben", benIdx); }
  if (L.trivia) { trivIdx = (trivIdx + 1) % TRIVIA.length; store("atec-triv", trivIdx); }
  if (i === lista.length - 1) construir();
  mostrar(i + 1);
}

function ajustar() {
  const vp = document.getElementById("viewport");
  const s = Math.min(vp.clientWidth / 1920, vp.clientHeight / 1080);
  stage.style.transform = `translate(-50%, -50%) scale(${s})`;
}
addEventListener("resize", ajustar);
function reloj() {
  const d = new Date();
  document.getElementById("clockT").textContent = d.toLocaleTimeString("es-CL", { timeZone: TZ, hour: "2-digit", minute: "2-digit", hour12: false });
  document.getElementById("clockD").textContent = d.toLocaleDateString("es-CL", { timeZone: TZ, weekday: "long", day: "numeric", month: "long" }).replace(/^./, c => c.toUpperCase());
}
setInterval(reloj, 1000);

const bPause = document.getElementById("bPause"), bFs = document.getElementById("bFs");
function togglePause() { paused = !paused; bPause.textContent = paused ? "Reanudar" : "Pausar"; if (paused) clearTimeout(timer); else mostrar(i); }
document.getElementById("bPrev").onclick = () => mostrar(i - 1);
document.getElementById("bNext").onclick = () => siguiente();
bPause.onclick = togglePause;
bFs.onclick = async () => {
  try { if (!document.fullscreenElement) await document.documentElement.requestFullscreen(); else await document.exitFullscreen(); }
  catch (e) { bFs.textContent = "Pantalla completa no disponible"; }
};
document.addEventListener("fullscreenchange", () => {
  document.body.classList.toggle("fs", !!document.fullscreenElement);
  bFs.textContent = document.fullscreenElement ? "Salir de pantalla completa" : "Pantalla completa";
  setTimeout(ajustar, 50);
});
addEventListener("keydown", e => {
  if (e.key === "ArrowRight") siguiente(); else if (e.key === "ArrowLeft") mostrar(i - 1);
  else if (e.key === " ") { e.preventDefault(); togglePause(); } else if (e.key === "f" || e.key === "F") bFs.click();
});
let idleT;
function despertar() {
  document.body.classList.add("show-ui"); document.body.classList.remove("idle");
  clearTimeout(idleT); idleT = setTimeout(() => { document.body.classList.remove("show-ui"); document.body.classList.add("idle"); }, 3000);
}
addEventListener("mousemove", despertar); addEventListener("touchstart", despertar, { passive: true });
async function noDormir() { try { if ("wakeLock" in navigator) await navigator.wakeLock.request("screen"); } catch (e) {} }
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") { noDormir(); if (!paused) mostrar(i); } });
/* Sin recarga automática: la TV no tiene internet. Fecha, cumpleaños y pregunta del día se recalculan solos en cada vuelta. */

ajustar(); reloj(); construir(); mostrar(0); noDormir();
</script>
